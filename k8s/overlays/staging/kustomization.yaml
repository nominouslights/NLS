apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Its own namespace, which is also what makes the frontend images portable: they bake
# http://northernlink-api:8080 into their /api/* rewrite at build time, and a bare Service name
# resolves inside the pod's own namespace. Same image, different API, no rebuild.
namespace: northern-link-staging

resources:
  - ../../base

patches:
  # `namespace:` above retargets every namespaced object, but the Namespace object itself is
  # cluster-scoped — it has to be renamed by name, which needs an explicit target.
  - target:
      kind: Namespace
      name: northern-link
    patch: |-
      - op: replace
        path: /metadata/name
        value: northern-link-staging
  - path: ingress-patch.yaml

images:
  - name: ghcr.io/nominouslights/northernlink-api
    newTag: latest
  - name: ghcr.io/nominouslights/northernlink-dispatcher
    newTag: latest
  - name: ghcr.io/nominouslights/northernlink-website
    newTag: latest
  - name: ghcr.io/nominouslights/northernlink-budgeting
    newTag: latest
