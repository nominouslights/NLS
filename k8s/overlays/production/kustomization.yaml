apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: northern-link

resources:
  - ../../base

# The base already carries the production hostnames, so there is no ingress patch here —
# staging is the one that overrides them.

# Pin a real immutable tag before every production apply. :latest is a rollback you cannot
# perform: `kubectl rollout undo` would land on the same moving tag.
images:
  - name: ghcr.io/nominouslights/northernlink-api
    newTag: latest
  - name: ghcr.io/nominouslights/northernlink-dispatcher
    newTag: latest
  - name: ghcr.io/nominouslights/northernlink-website
    newTag: latest
  - name: ghcr.io/nominouslights/northernlink-budgeting
    newTag: latest
