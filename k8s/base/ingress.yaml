# Public entry point. Three hostnames, one per frontend — deliberately NOT path prefixes on a
# single host: none of the apps sets a Next.js basePath, so /dispatcher/* routing would break
# every asset URL. Distinct origins also keep the two consoles' localStorage refresh-token keys
# (nl.dispatcher.refreshToken / nl.budgeting.refreshToken) in separate storage partitions
# instead of relying on the key names alone.
#
# northernlink-api is absent from this file on purpose and must stay absent. The platform has
# no CORS configuration anywhere; browsers only ever reach the API through a frontend's own
# origin via the server-side /api/* proxy.
#
# Replace the hostnames per environment in the overlay (see k8s/overlays/*).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: northernlink
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - northernlinkshuttle.ca
        - dispatch.northernlinkshuttle.ca
        - budget.northernlinkshuttle.ca
      secretName: northernlink-tls
  rules:
    - host: northernlinkshuttle.ca
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: northernlink-website
                port:
                  name: http
    - host: dispatch.northernlinkshuttle.ca
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: northernlink-dispatcher
                port:
                  name: http
    - host: budget.northernlinkshuttle.ca
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: northernlink-budgeting
                port:
                  name: http
