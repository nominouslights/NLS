# TEMPLATE ONLY — copy to secret.yaml, fill in, and apply out of band. secret.yaml is
# gitignored; never commit real values.
#
#   cp k8s/base/secret.example.yaml k8s/base/secret.yaml
#   $EDITOR k8s/base/secret.yaml
#   kubectl apply -n northern-link -f k8s/base/secret.yaml
#
# Every name below is read by NorthernLink.Shared.Kernel.RequiredEnvironmentVariable, which
# reads the process environment directly and throws if a value is missing or blank. The first
# four abort startup; the last three fail lazily on first use of object storage or email.
apiVersion: v1
kind: Secret
metadata:
  name: northernlink-api-secrets
type: Opaque
stringData:
  # MUST authenticate as northernlink_app, not a superuser: a superuser bypasses Row-Level
  # Security even with FORCE, which would make every RLS policy dead code. The role also needs
  # GRANT CREATE ON DATABASE for startup migrations — see Backend/docker/initdb/01-app-role.sql.
  # No PgBouncer in transaction pooling mode in front of this: TenantSessionInterceptor sets
  # app.tenant_id per connection, and transaction pooling would leak sessions across tenants.
  ConnectionStrings__Postgres: "Host=...;Port=25060;Database=northernlink;Username=northernlink_app;Password=...;SSL Mode=Require;Trust Server Certificate=true"

  # HS256 signing key for access tokens. Rotating it invalidates every issued token.
  Identity__JwtSigningKey: "replace-me-with-a-long-random-value"

  RabbitMq__UserName: "northernlink"
  RabbitMq__Password: "replace-me"

  # Optional — read lazily, so the API starts without them and only fails when a feature that
  # needs them is first used.
  ObjectStorage__AccessKey: ""
  ObjectStorage__SecretKey: ""
  Notifications__PostmarkApiKey: ""
