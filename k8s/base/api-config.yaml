# Non-secret API configuration. Everything here is IConfiguration-bound, so the double
# underscore maps onto appsettings.json's nesting (RabbitMq__HostName -> RabbitMq:HostName).
# Secrets are NOT here and never can be — RequiredEnvironmentVariable reads them straight from
# the process environment, bypassing IConfiguration entirely.
apiVersion: v1
kind: ConfigMap
metadata:
  name: northernlink-api-config
data:
  ASPNETCORE_ENVIRONMENT: "Production"

  # The image pins no port — the API is cluster-internal, so this is the one place the listen
  # port is decided. Change it here and in the Deployment's containerPort together.
  ASPNETCORE_HTTP_PORTS: "8080"

  # appsettings.json says "localhost", which is meaningless in a pod. The broker lives in the
  # cluster; the API finds it through config, not service discovery.
  RabbitMq__HostName: "rabbitmq"
  RabbitMq__Port: "5672"

  # Deployed containers own the schema. Local runs deliberately do not — see MigrationOptions.
  Migrations__RunOnStartup: "true"
