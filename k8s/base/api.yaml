apiVersion: apps/v1
kind: Deployment
metadata:
  name: northernlink-api
  labels:
    app.kubernetes.io/name: northernlink-api
    app.kubernetes.io/component: api
spec:
  # SINGLE REPLICA, AND NOT BY TIMIDITY. Each pod runs eight OutboxDispatcher background
  # services plus TripGenerationWorker in-process, and OutboxDispatcher's own doc comment
  # records that FOR UPDATE SKIP LOCKED is deliberately omitted ("single API instance today").
  # A second replica would double-publish integration events and duplicate generated trips.
  # Scaling out needs SKIP LOCKED or leader election first — a separate piece of work.
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: a surge pod would briefly run a second set of those workers,
    # which is exactly what the replica count above exists to prevent.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: northernlink-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: northernlink-api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/nominouslights/northernlink-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: northernlink-api-config
            - secretRef:
                name: northernlink-api-secrets
          # /health reports ready only once startup migrations have finished AND Postgres is
          # reachable. That readiness gate is load-bearing: Kestrel starts listening before any
          # IHostedService runs, so nothing else keeps traffic off a half-migrated schema.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 30 # up to 5 minutes for a first-run migration
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          # /alive is a pure process check — nothing is tagged "live". A liveness probe that
          # failed on a database outage would restart every pod in a loop instead of just
          # draining them out of the Service.
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
# ClusterIP ONLY — this Service must never gain an Ingress rule. The platform has no CORS
# configuration anywhere by design: browsers talk exclusively to a frontend's own origin, and
# the Next.js server proxies /api/* here. Exposing the API publicly would break that premise
# and force a CORS policy into the backend.
#
# The name matters. The frontend images bake http://northernlink-api:8080 into their rewrite at
# build time, and a bare Service name resolves within the pod's own namespace — which is how
# one image serves staging and production unchanged.
apiVersion: v1
kind: Service
metadata:
  name: northernlink-api
  labels:
    app.kubernetes.io/name: northernlink-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: northernlink-api
  ports:
    - name: http
      port: 8080
      targetPort: http
