# Dispatch Console (Admin Web App).
#
# Freely scalable, unlike the API: this is a stateless Next.js server with no background
# workers. Auth is entirely client-side (access token in memory, refresh token in localStorage
# under an app-distinct key), so there are no cookies, no sticky sessions and no SameSite or
# cookie-domain concerns behind the ingress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: northernlink-dispatcher
  labels:
    app.kubernetes.io/name: northernlink-dispatcher
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: northernlink-dispatcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: northernlink-dispatcher
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dispatcher
          image: ghcr.io/nominouslights/northernlink-dispatcher:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          # No env here on purpose. The /api/* proxy target and every NEXT_PUBLIC_* value are
          # baked in at image build time (next build writes rewrites into routes-manifest.json
          # and inlines NEXT_PUBLIC_* into the client bundle), so setting them at runtime would
          # look like configuration while doing nothing. See the app's Dockerfile.
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # The standalone server writes its fetch/ISR cache here, so it needs a writable
            # mount once the root filesystem is read-only.
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: northernlink-dispatcher
  labels:
    app.kubernetes.io/name: northernlink-dispatcher
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: northernlink-dispatcher
  ports:
    - name: http
      port: 80
      targetPort: http
