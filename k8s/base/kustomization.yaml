apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: northern-link

# `labels` rather than the deprecated `commonLabels`, and without includeSelectors: a label
# folded into a Deployment's selector is immutable after the first apply.
labels:
  - pairs:
      app.kubernetes.io/part-of: northern-link

resources:
  - namespace.yaml
  - api-config.yaml
  - api.yaml
  - rabbitmq.yaml
  - dispatcher.yaml
  - website.yaml
  - budgeting.yaml
  - ingress.yaml

# secret.example.yaml is NOT a resource — copy it to secret.yaml (gitignored), fill it in, and
# apply it out of band.

# Overlays pin a real tag; :latest here only keeps the base applyable on its own.
images:
  - name: ghcr.io/nominouslights/northernlink-api
    newTag: latest
  - name: ghcr.io/nominouslights/northernlink-dispatcher
    newTag: latest
  - name: ghcr.io/nominouslights/northernlink-website
    newTag: latest
  - name: ghcr.io/nominouslights/northernlink-budgeting
    newTag: latest
