name: northernlink

services:
  postgres:
    image: postgres:17-alpine
    container_name: northernlink-postgres
    environment:
      POSTGRES_USER: northernlink
      POSTGRES_PASSWORD: northernlink_dev
      POSTGRES_DB: northernlink
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northernlink -d northernlink"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: northernlink-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: northernlink
      RABBITMQ_DEFAULT_PASS: northernlink_dev
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 10

volumes:
  postgres-data:
  rabbitmq-data:
