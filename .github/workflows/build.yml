name: build

# Publishes the four deployable images to GHCR — that is this workflow's whole job, by the
# owner's decision: CI ends at the package registry, and deployment happens outside CI from
# those images. No deploy steps belong here, and no test gate either (run `dotnet test` and
# Budgeting's `npm test` locally before pushing). CommunityMobile/ is excluded (Flutter design
# mockup, not a server workload) and AppHost/ is excluded on purpose — it is the local dev
# orchestrator, and its AppHost.cs is gitignored, so it does not exist in a CI checkout.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # The /api/* proxy target needs no build-arg: each Dockerfile already defaults to
        # http://northernlink-api:8080, which resolves on the deployment's private network (on
        # App Platform: a component named northernlink-api with internal_ports: [8080] — see
        # .do/app.yaml), so one value serves every environment.
        #
        # BASE_PATH does need one. The three frontends share a single hostname on App Platform
        # and are separated by path prefix, and a Next.js basePath is compiled into every asset
        # URL at build time — so these images are mounted-location-specific by construction.
        # Change a prefix here and the matching ingress rule in .do/app.yaml has to change with
        # it, or the app 404s on its own JavaScript. NEXT_PUBLIC_API_BASE_URL must always equal
        # BASE_PATH: it is what redirects browser fetches to /dispatch/api/* instead of /api/*,
        # which would otherwise hit whichever component owns "/". Website has neither — it owns
        # the root and makes no API calls.
        include:
          # The API's build context is the REPOSITORY ROOT: Directory.Build.props and
          # Directory.Packages.props live above Backend/ and MSBuild walks up to find them.
          - name: api
            context: .
            dockerfile: Backend/Dockerfile
          - name: dispatcher
            context: Dispatcher
            dockerfile: Dispatcher/Dockerfile
            build_args: |
              BASE_PATH=/dispatch
              NEXT_PUBLIC_API_BASE_URL=/dispatch
          - name: website
            context: Website
            dockerfile: Website/Dockerfile
          - name: budgeting
            context: Budgeting
            dockerfile: Budgeting/Dockerfile
            build_args: |
              BASE_PATH=/budget
              NEXT_PUBLIC_API_BASE_URL=/budget
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        # Pull requests get built but not pushed — a fork PR has no package write token.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/northernlink-${{ matrix.name }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
