name: build

# Publishes the five deployable images to GHCR — that is this workflow's whole job, by the
# owner's decision: CI ends at the package registry, and deployment happens outside CI from
# those images. No deploy steps belong here, and no test gate either (run `node run-tests.mjs`
# at the repo root before pushing, or enable the pre-push hook with
# `git config core.hooksPath .githooks`). CommunityMobile/ is excluded (Flutter design mockup,
# not a server workload) and AppHost/ is excluded on purpose — it is the local dev
# orchestrator, and its AppHost.cs is gitignored, so it does not exist in a CI checkout.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # The /api/* proxy target needs no arg: each Dockerfile already defaults to
        # http://northernlink-api:8080, which resolves on the deployment's private network (on
        # App Platform: a component named northernlink-api with internal_ports: [8080] — see
        # .do/app.yaml), so one value serves every environment.
        #
        # BASE_PATH is the arg that matters, because a Next.js basePath is compiled into every
        # asset URL at build time. Who gets one is decided by HOW THE APP IS REACHED, which is
        # fixed by the ingress rules in .do/app.yaml (the two must agree, see below):
        #
        #   dispatcher  own hostname app.northernlinkshuttleandcargo.com, owns "/" → no BASE_PATH.
        #   budgeting   own hostname budget.northernlinkshuttleandcargo.com, owns "/" → no
        #               BASE_PATH either. It WAS mounted at /budget on the dispatcher hostname;
        #               the live app moved it to its own subdomain (an ALIAS domain plus an
        #               authority-matched ingress rule) while the image still carried
        #               BASE_PATH=/budget, and the subdomain's root 404'd until the two agreed.
        #   driverfield mounted /driver on the dispatcher hostname → BASE_PATH +
        #               NEXT_PUBLIC_API_BASE_URL, always equal.
        #   website     not deployed yet → nothing. If it ever takes the root, dispatcher moves
        #               to /dispatch and gains args at the same time, in one sitting.
        #
        # For a prefixed app both args are required and must match: BASE_PATH moves the asset
        # URLs, NEXT_PUBLIC_API_BASE_URL moves the browser's fetches (lib/api/transport.ts
        # prefixes an absolute /api/... that Next does not rewrite, so without it the calls leave
        # the prefix and land on whichever component owns "/"). For an app on its own hostname
        # both must be ABSENT: a basePath makes the app 404 on the bare "/" its hostname sends it.
        #
        # A MIS-PREFIXED BUILD DOES NOT 404 — IT SERVES THE WRONG APP. Three frontends now carry
        # byte-identical copies of Dispatcher's design system, so turbopack emits identical chunk
        # names across them. Get a prefix wrong and a driver's tablet silently renders the
        # DISPATCH CONSOLE, which is far worse than a missing page. After building, curl the
        # image and grep the HTML for the expected prefix in /_next/static/ before shipping.
        #
        # THIS IS COUPLED TO .do/app.yaml AND MUST NEVER SHIP HALF. Each prefixed ingress rule
        # needs preserve_path_prefix: true and a health_check http_path matching the prefix; each
        # hostname-per-app rule needs an authority match and an unprefixed image. Ship the image
        # without the spec and the page itself 404s; ship the spec without the image and the app
        # 404s on its own JavaScript. Publish first, then apply the spec.
        #
        # Dispatcher additionally carries NEXT_PUBLIC_BUDGETING_URL: the launcher's Budgeting
        # tile target, now the subdomain's absolute URL. Leave it unset and the tile reads
        # "Not configured" while the console it points at is live.
        include:
          # The API's build context is the REPOSITORY ROOT: Directory.Build.props and
          # Directory.Packages.props live above Backend/ and MSBuild walks up to find them.
          - name: api
            context: .
            dockerfile: Backend/Dockerfile
          # No BASE_PATH: dispatcher owns "/" on its hostname. NEXT_PUBLIC_BUDGETING_URL is not a
          # prefix for dispatcher itself — it is where its launcher's Budgeting tile points.
          - name: dispatcher
            context: Dispatcher
            dockerfile: Dispatcher/Dockerfile
            build_args: |
              NEXT_PUBLIC_BUDGETING_URL=https://budget.northernlinkshuttleandcargo.com
          - name: website
            context: Website
            dockerfile: Website/Dockerfile
          # No BASE_PATH and no NEXT_PUBLIC_API_BASE_URL: budgeting owns "/" on its own
          # subdomain, so root-relative assets and same-origin /api/* fetches are correct.
          - name: budgeting
            context: Budgeting
            dockerfile: Budgeting/Dockerfile
          # Unlike the other frontends this one HAS a public/ (service worker + PWA icons), and
          # its Dockerfile deliberately copies it into the runtime image rather than creating an
          # empty one. Do not "align" that Dockerfile with the others — see DriverField/CLAUDE.md.
          - name: driverfield
            context: DriverField
            dockerfile: DriverField/Dockerfile
            build_args: |
              BASE_PATH=/driver
              NEXT_PUBLIC_API_BASE_URL=/driver
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        # Pull requests get built but not pushed — a fork PR has no package write token.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/northernlink-${{ matrix.name }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
